version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns: ['expo', 'expo-*', 'react-native', 'react-native-*']
      next:
        patterns: ['next', 'react', 'react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
