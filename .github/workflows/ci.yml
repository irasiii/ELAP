name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (core, web, mobile)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build website
        run: npm run web:build
      - name: Dependency audit (production, high and critical fail the build)
        run: npm run audit:prod
      - name: Bundle Android app JavaScript
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir ../../dist/mobile
        env:
          CI: '1'
          EXPO_PUBLIC_API_URL: https://example.invalid
